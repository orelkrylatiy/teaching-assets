name: Prepare generated photo packs
on:
  push:
    branches: [main]
    paths:
      - 'assets/photo-sources/**'
      - '.github/workflows/prepare-photo-packs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  picture-me:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow python-pptx reportlab pypdf
      - name: Split reviewed My World in Pictures photographs
        run: |
          python scripts/import-photo-sheet.py \
            --lesson picture-me \
            --image assets/photo-sources/picture-me-12-original.png \
            --grid 4x3 \
            --approved
      - name: Create downloadable photo PowerPoints and printable worksheets
        run: python scripts/build-photo-packs.py
      - name: Verify all photo presentation bundles
        run: |
          python scripts/test-photo-packs.py
      - name: Verify pixel and curriculum mapping
        run: |
          python scripts/test-media-import.py
          node scripts/verify.mjs
      - name: Commit generated WebP cards and lesson mapping
        run: |
          git add data.js assets/photos/picture-me assets/packs
          if git diff --cached --quiet; then
            echo "Images and mapping already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(photos): add 12 word-mapped My World in Pictures photo cards"
          git push origin HEAD:main
