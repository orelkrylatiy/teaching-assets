name: Deploy Teaching Assets to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.check-pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.mjs
      - name: Check whether Pages is enabled
        id: check-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          http_status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$http_status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Pages is not enabled or inaccessible (HTTP $http_status). In Settings > Pages, choose GitHub Actions as source; then rerun this workflow. Site source is validated and available as a downloadable artifact from the Verify English lesson library workflow."
            echo "## Deployment requires one-time GitHub Pages setup" >> "$GITHUB_STEP_SUMMARY"
            echo "Open **Settings → Pages → Build and deployment → GitHub Actions**. Until this is enabled, every push still creates a validated site-preview artifact." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/configure-pages@v5
        if: steps.check-pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.check-pages.outputs.enabled == 'true'
        with:
          path: dist
  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
