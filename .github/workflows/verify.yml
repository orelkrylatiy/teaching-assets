name: Verify English lesson library
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.mjs
      - run: python3 -m pip install --user Pillow
      - run: python3 scripts/test-media-import.py
      - run: node scripts/smoke-exports.mjs
      - run: node scripts/smoke-workshop.mjs
      - run: python3 scripts/workshop-browser-smoke.py
      - run: python3 scripts/slovak-browser-smoke.py
      - run: python3 scripts/browser-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: sample-teaching-exports
          path: dist/examples
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: dist
          retention-days: 14
