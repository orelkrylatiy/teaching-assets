name: Verify English lesson library
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.mjs
      - run: node scripts/smoke-exports.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sample-teaching-exports
          path: dist/examples
          retention-days: 7
